<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student's Document Collection Portal (SDCP)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== LANDING VIEW ===================== -->
  <main id="view-landing" class="view">
    <div class="topbar">
      <button class="menu-btn" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <h1 class="title-pill">Student's Document Collection Portal <br><span>(SDCP)</span></h1>
    </div>

    <p class="instructions">
      Upload the requested document to your respective section.<br>
      Uploading to the wrong section may delay processing of your submission.
    </p>

    <div id="section-grid" class="section-grid">
      <!-- Buttons are generated by script.js from config.js -->
    </div>
  </main>

  <!-- ===================== UPLOAD VIEW ===================== -->
  <main id="view-upload" class="view hidden">
    <button id="back-btn" class="back-btn" type="button">&larr; Back to sections</button>

    <div class="badge" id="upload-badge">M13</div>

    <div class="upload-panel">
      <label id="dropzone" class="dropzone" for="file-input">
        <span id="dropzone-text">No file selected</span>
        <span id="dropzone-hint">Click to browse a file from your device</span>
      </label>
      <input type="file" id="file-input" hidden>

      <div class="button-row">
        <button id="choose-btn" class="btn btn-secondary" type="button">Upload Document</button>
        <button id="clear-btn" class="btn btn-secondary" type="button">Clear</button>
      </div>

      <p id="error-msg" class="error-msg hidden"></p>

      <button id="submit-btn" class="btn btn-primary hidden" type="button">Submit</button>

      <div id="uploading-state" class="uploading-state hidden">
        <div class="spinner"></div>
        <span>Uploading, please don't close this tab&hellip;</span>
      </div>
    </div>
  </main>

  <!-- ===================== THANK YOU VIEW ===================== -->
  <main id="view-thanks" class="view hidden">
    <div class="badge" id="thanks-badge">M13</div>
    <div class="thanks-card">
      <h2>THANK YOU!</h2>
      <p>Your document has been uploaded successfully.</p>
    </div>
    <button id="upload-another-btn" class="btn btn-secondary upload-another">Upload another document</button>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
